# cgdns node configuration.
#
# This file ships deliberately incomplete. Listen addresses and the query ACL
# have no safe default -- a wildcard bind breaks anycast source selection, and a
# default-allow ACL is an open resolver -- so the daemon refuses to start until
# they are set. Validate with:
#
#   cgdns -config /etc/cgdns/cgdns.yaml -check
#
# Every setting is validated at startup and all problems are reported at once.

node:
  # Unique within the pair. It identifies this node on the pair link and breaks
  # ties between concurrent control-plane writes.
  id: ""
  state_dir: /var/lib/cgdns

listen:
  # The anycast service addresses. Bind them explicitly: a wildcard bind loses
  # the destination address, so replies would leave with the wrong source and
  # anycast would break subtly, under load.
  udp: []
  tcp: []
  # dot: ["<anycast-v4>:853", "[<anycast-v6>]:853"]
  # doh: ["<anycast-v4>:443", "[<anycast-v6>]:443"]

  # DNS over QUIC (RFC 9250). The same port number as DoT but a different
  # socket: one is TCP, the other UDP, so both can run on 853 at once.
  #
  # QUIC gives every query its own stream, so a slow answer no longer stalls the
  # ones behind it the way it does on a shared DoT connection. It wants a larger
  # UDP receive buffer than the kernel default -- raise net.core.rmem_max and
  # net.core.wmem_max to a few MB or the stack will log that it could not.
  # doq: ["<anycast-v4>:853", "[<anycast-v6>]:853"]
  doq_max_idle_timeout: 30s
  doq_max_streams_per_conn: 256

  # SO_REUSEPORT sockets per UDP address, and handler goroutines per socket.
  # Together they bound in-flight queries. 0 means one socket per CPU and the
  # built-in worker default.
  udp_sockets_per_addr: 0
  udp_workers_per_socket: 0

  # Default deny. List the subscriber prefixes this node answers recursion for;
  # a resolver open to the internet is an amplification source.
  allow_query: []

  # tls:
  #   cert_file: /etc/cgdns/tls/service.pem
  #   key_file: /etc/cgdns/tls/service.key

  # Only set this if DoH sits behind an L7 proxy. The client address selects
  # subscriber policy, so believing a forwarding header from an untrusted peer
  # lets any client claim another subscriber's filtering.
  # doh_trusted_proxies: []

resolver:
  # Pin the local address outbound queries leave from. Under anycast the
  # service address is shared with the sibling, so a query sourced from it
  # invites the reply back to whichever node the return path picks. Use an
  # address unique to this node -- its loopback. Empty keeps the kernel's
  # choice. The daemon refuses to start if it cannot bind what you name here.
  # outbound_source_v4: "<this-node-loopback-v4>"
  # outbound_source_v6: "<this-node-loopback-v6>"
  mode: recursive
  dnssec: true
  use_ipv4: true
  use_ipv6: true

cache:
  max_entries: 1000000

  # Answer from expired data when the authoritative cannot be reached
  # (RFC 8767). It never competes with a working authoritative: a live entry is
  # served normally, and stale data is consulted only after resolution fails.
  # Health checks deliberately do not accept a stale answer, so a node that has
  # lost the internet still withdraws from the anycast set.
  # Refresh popular entries shortly before they expire, so no client pays for
  # the upstream round trip. Only names actually being asked for are refreshed,
  # so an idle entry expires normally rather than the cache becoming a crawler.
  # Denials are never refreshed.
  prefetch:
    enabled: true
    # Fraction of the original TTL that must remain to trigger a refresh.
    threshold: 0.1
    # Records shorter than this are meant to be re-fetched often; chasing them
    # would cost more upstream traffic than it saves.
    min_ttl: 30s
    max_concurrent: 64
    timeout: 5s

  serve_stale:
    enabled: true
    # Longer keeps subscribers online through a longer outage, at the cost of
    # answering with data that may have moved.
    max_stale: 1h
    # Short on purpose: the client should come back soon, because by then the
    # authoritative may have recovered.
    answer_ttl: 30s

# Response rate limiting, on UDP only. TCP, DoT and DoH complete a handshake,
# so there is nothing to spoof and nothing to reflect.
rate_limit:
  enabled: true
  # Answers are left unlimited: a subscriber legitimately asks for names that
  # exist, and limiting that class is how you break your own customers.
  responses_per_second: 0
  # Denials are grouped by the zone that denied them, so a random-subdomain
  # flood collapses into one bucket instead of one per made-up name. This is
  # the limit that stops water-torture.
  denials_per_second: 50
  errors_per_second: 20
  # How much unused allowance a client may bank. A source seen for the first
  # time starts with one second's worth, not a full window.
  window: 15s
  # Every 2nd over-limit response is sent truncated so a real client retries
  # over TCP. 0 always drops.
  slip_ratio: 2
  ipv4_prefix_len: 24
  ipv6_prefix_len: 56
  max_buckets: 100000
  # exempt_clients: ["<monitoring-prefix>"]

control:
  store_file: /var/lib/cgdns/control.json

# The link to the other node in this POP. Config replication is reliable;
# cache sharing is best-effort and never blocks a query.
peer:
  enabled: false
  # listen: "<this-node-pair-ip>:8853"
  # remote: "<sibling-pair-ip>:8853"
  # Mutual TLS is mandatory: the sibling may insert into this node's cache, so
  # an unauthenticated peer could poison it.
  # ca_file: /etc/cgdns/tls/pair-ca.pem
  # tls:
  #   cert_file: /etc/cgdns/tls/pair.pem
  #   key_file: /etc/cgdns/tls/pair.key

# Health drives anycast advertisement. gobgpd runs as its own unit; cgdns talks
# to it over gRPC and never shells out to a routing CLI.
health:
  enabled: false
  # anycast_prefixes: ["<anycast-v4>/32", "<anycast-v6>/128"]
  # gobgp_target: "127.0.0.1:50051"

# The operator API and WebUI. Both are served here and nowhere else: enabling
# the UI adds no listener of its own.
#
# Bind the management interface address. The daemon refuses to start on a
# wildcard, on an address shared with a DNS listener, or on anything inside
# health.anycast_prefixes -- an anycast address is routed from the whole
# internet and moves between nodes, which is no place for an admin plane. Off
# loopback, TLS and allow_from both become mandatory.
management:
  enabled: true
  listen:
    - "127.0.0.1:8443"
  # allow_from: ["<management-prefix>"]
  # tls:
  #   cert_file: /etc/cgdns/tls/mgmt.pem
  #   key_file: /etc/cgdns/tls/mgmt.key
  bootstrap_token_file: /var/lib/cgdns/bootstrap.token

metrics:
  listen: "127.0.0.1:9153"
  path: /metrics

log:
  level: info
  format: text
