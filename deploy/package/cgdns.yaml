# cgdns node configuration.
#
# This file ships deliberately incomplete. Listen addresses and the query ACL
# have no safe default -- a wildcard bind breaks anycast source selection, and a
# default-allow ACL is an open resolver -- so the daemon refuses to start until
# they are set. Validate with:
#
#   cgdns -config /etc/cgdns/cgdns.yaml -check
#
# Every setting is validated at startup and all problems are reported at once.

node:
  # Unique within the pair. It identifies this node on the pair link and breaks
  # ties between concurrent control-plane writes.
  id: ""
  state_dir: /var/lib/cgdns

listen:
  # The anycast service addresses. Bind them explicitly: a wildcard bind loses
  # the destination address, so replies would leave with the wrong source and
  # anycast would break subtly, under load.
  udp: []
  tcp: []
  # dot: ["<anycast-v4>:853", "[<anycast-v6>]:853"]
  # doh: ["<anycast-v4>:443", "[<anycast-v6>]:443"]

  # Default deny. List the subscriber prefixes this node answers recursion for;
  # a resolver open to the internet is an amplification source.
  allow_query: []

  # tls:
  #   cert_file: /etc/cgdns/tls/service.pem
  #   key_file: /etc/cgdns/tls/service.key

  # Only set this if DoH sits behind an L7 proxy. The client address selects
  # subscriber policy, so believing a forwarding header from an untrusted peer
  # lets any client claim another subscriber's filtering.
  # doh_trusted_proxies: []

resolver:
  mode: recursive
  dnssec: true
  use_ipv4: true
  use_ipv6: true

cache:
  max_entries: 1000000

# Response rate limiting, on UDP only. TCP, DoT and DoH complete a handshake,
# so there is nothing to spoof and nothing to reflect.
rate_limit:
  enabled: true
  # Answers are left unlimited: a subscriber legitimately asks for names that
  # exist, and limiting that class is how you break your own customers.
  responses_per_second: 0
  # Denials are grouped by the zone that denied them, so a random-subdomain
  # flood collapses into one bucket instead of one per made-up name. This is
  # the limit that stops water-torture.
  denials_per_second: 50
  errors_per_second: 20
  # How much unused allowance a client may bank. A source seen for the first
  # time starts with one second's worth, not a full window.
  window: 15s
  # Every 2nd over-limit response is sent truncated so a real client retries
  # over TCP. 0 always drops.
  slip_ratio: 2
  ipv4_prefix_len: 24
  ipv6_prefix_len: 56
  max_buckets: 100000
  # exempt_clients: ["<monitoring-prefix>"]

control:
  store_file: /var/lib/cgdns/control.json

# The link to the other node in this POP. Config replication is reliable;
# cache sharing is best-effort and never blocks a query.
peer:
  enabled: false
  # listen: "<this-node-pair-ip>:8853"
  # remote: "<sibling-pair-ip>:8853"
  # Mutual TLS is mandatory: the sibling may insert into this node's cache, so
  # an unauthenticated peer could poison it.
  # ca_file: /etc/cgdns/tls/pair-ca.pem
  # tls:
  #   cert_file: /etc/cgdns/tls/pair.pem
  #   key_file: /etc/cgdns/tls/pair.key

# Health drives anycast advertisement. gobgpd runs as its own unit; cgdns talks
# to it over gRPC and never shells out to a routing CLI.
health:
  enabled: false
  # anycast_prefixes: ["<anycast-v4>/32", "<anycast-v6>/128"]
  # gobgp_target: "127.0.0.1:50051"

# The operator API. Bind the management interface address, never a service or
# anycast address -- the daemon refuses to start if they overlap. Off loopback,
# TLS and allow_from both become mandatory.
management:
  enabled: true
  listen:
    - "127.0.0.1:8443"
  # allow_from: ["<management-prefix>"]
  # tls:
  #   cert_file: /etc/cgdns/tls/mgmt.pem
  #   key_file: /etc/cgdns/tls/mgmt.key
  bootstrap_token_file: /var/lib/cgdns/bootstrap.token

metrics:
  listen: "127.0.0.1:9153"
  path: /metrics

log:
  level: info
  format: text
